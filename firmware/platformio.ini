; eCookBook firmware for the Seeed reTerminal E1001 (ESP32-S3, 7.5" 800x480 UC8179).
;   pio run -t upload
;   pio device monitor
;   pio test -e native   (host-side unit tests)

[platformio]
default_envs = e1001

[env:native]
platform = native

[env:e1001]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2 @ ^1.6.0
  olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
